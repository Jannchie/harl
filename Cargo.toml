[workspace]
resolver = "3"
members = ["crates/harl-core", "crates/harl"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Jannchie/harl"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"

# pnpm dev 跑的是 debug 构建：不优化时解压 / 归一化 / hash 慢一个数量级，首次汇总要等很久。
# 自己的 crate 开 1 级（增量编译仍快），依赖只编一次，直接开满
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
