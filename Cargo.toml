[package]
name = "harl"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Append-only, content-addressed archive of AI coding-agent sessions"
repository = "https://github.com/Jannchie/harl"

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"
