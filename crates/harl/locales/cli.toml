zh-CN = "显示帮助"
ja = "ヘルプを表示"

["cli.builtin.version"]
en = "Print version"
zh-CN = "显示版本"
ja = "バージョンを表示"

["cli.builtin.help_cmd"]
en = "Print this message or the help of the given subcommand(s)"
zh-CN = "显示本帮助，或指定子命令的帮助"
ja = "このヘルプ、または指定したサブコマンドのヘルプを表示"

["cli.builtin.help_cmd_arg"]
en = "Print help for the subcommand(s)"
zh-CN = "要查看帮助的子命令"
ja = "ヘルプを表示するサブコマンド"

["cli.heading.usage"]
en = "Usage:"
zh-CN = "用法:"
ja = "使い方:"

["cli.heading.commands"]
en = "Commands"
zh-CN = "命令"
ja = "コマンド"

["cli.heading.options"]
en = "Options"
zh-CN = "选项"
ja = "オプション"

["cli.heading.arguments"]
en = "Arguments"
zh-CN = "参数"
ja = "引数"
