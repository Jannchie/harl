_version = 2

["main.no_home"]
en = "Cannot find the home directory"
zh-CN = "找不到 home 目录"
ja = "ホームディレクトリが見つかりません"

["main.skip"]
en = "skipping %{source}: %{error}"
zh-CN = "跳过 %{source}: %{error}"
ja = "%{source} をスキップ: %{error}"

["main.no_match"]
en = "No source file path contains %{needle}"
zh-CN = "没有源文件路径包含 %{needle}"
ja = "%{needle} を含むソースファイルパスはありません"

["main.many_matches"]
en = "%{needle} matches %{n} source files; be more specific:"
zh-CN = "%{needle} 匹配了 %{n} 个源文件，请更具体："
ja = "%{needle} は %{n} 個のソースファイルに一致しました。もっと具体的に指定してください："

["main.no_tree_record"]
en = "No record with tree %{tree} in the manifest; use the source file path instead"
zh-CN = "manifest 里没有 tree 为 %{tree} 的记录，请改用源文件路径"
ja = "manifest に tree が %{tree} のレコードはありません。ソースファイルのパスを使ってください"

["main.no_normalizer"]
en = "No normalizer for %{provider}"
zh-CN = "没有 %{provider} 的 normalizer"
ja = "%{provider} の normalizer がありません"

["main.root_missing"]
en = "root does not exist: %{path}"
zh-CN = "root 不存在: %{path}"
ja = "root が存在しません: %{path}"

["main.no_remote"]
en = "no remote configured (%{path}); capturing locally only"
zh-CN = "没配置远端（%{path}），只在本地 capture"
ja = "リモートが設定されていません（%{path}）。ローカルでのみ capture します"

["main.config_parse"]
en = "parsing %{path}"
zh-CN = "解析 %{path}"
ja = "%{path} の解析"

["main.config_read"]
en = "reading %{path}"
zh-CN = "读 %{path}"
ja = "%{path} の読み込み"

["main.gc_done"]
en = "derived cache: removed %{removed} stale rows, kept %{kept}; %{free} of index.db is now free pages"
zh-CN = "派生缓存：清掉 %{removed} 行过期的，留下 %{kept} 行；index.db 里现有 %{free} 空闲页"
ja = "派生キャッシュ：古い行を %{removed} 件削除、%{kept} 件を保持。index.db の空きページは %{free}"

["main.gc_vacuum_hint"]
en = "free pages are reused by later writes; run harl gc --vacuum to shrink the file (slow, needs extra disk space)"
zh-CN = "空闲页会被之后的写入复用；要缩小文件请运行 harl gc --vacuum（慢，要额外的磁盘空间）"
ja = "空きページは今後の書き込みで再利用されます。ファイルを縮めるには harl gc --vacuum を実行（遅く、追加のディスク容量が必要）"

["main.gc_vacuumed"]
en = "vacuumed index.db: %{before} → %{after}"
zh-CN = "已 VACUUM index.db：%{before} → %{after}"
ja = "index.db を VACUUM しました：%{before} → %{after}"
